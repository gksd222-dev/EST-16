<!DOCTYPE html>
<html lang="ko-KR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>CSS 상태및가상 요소 연습</title>
    <link rel="stylesheet" href="./style/selector3.css"/>
</head>
<body>

    <!-- 16 마우스오버 -->
    <a class="course-link" href="#">강의 보기</a>
    <hr/>
    <!-- 17 키보드 포커스 -->
    <button class="apply-button">수강 신청</button>
    <hr/>
    <!-- 18 체크 상태 -->
    <label><input type="checkbox"/>이용약관 동의</label>
    <hr/>
    <!-- 19 비활성 상태 -->
    <button disabled="disabled">다음 단계</button>
    <hr/>
    <!-- 20 가상 요소 -->
    <p class="notice">수업이 곧 시작됩니다</p>
    <a class="external" href="#">MDN 바로가기</a>
    

</body>
</html>
