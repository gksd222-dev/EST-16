<!DOCTYPE html>
<html lang="ko-KR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Document</title>

    <link rel="stylesheet" href="./style/register.css"/>
    <link rel="stylesheet" href="../learn-css/reset.css"/>
</head>
<body>
    <main class="register">
    <article class="register-card">
        <div class="register-content">
            <div class="header">
                <p class="register-head">환영합니다!</p>
                <p class="register-head2">
                아래 약관에 동의하시고 BBQ와 함께 하세요!   </p>
            </div>
        <div class="register-all-agree" >
            <input class="register-checkbox" type="checkbox"/> 전체동의
        </div>
        <hr>

        <div class="first-paragraph">
            <div class="register-all-agree">
                <input class="register-checkbox" type="checkbox"/> 이용약관 동의 (필수)
            </div>

            
            <div class="register-all-agree">
                <input class="register-checkbox" type="checkbox"/> 위치 기반 서비스 약관 동의 (필수)
            </div>
        </div>
        <hr>

        <div class="second-paragraph">
            <div class="register-all-agree">
                <input class="register-checkbox" type="checkbox"/> 마케팅 정보 알림 수신 동의 (필수)
                <p class="info">이벤트 및 혜택 정보를 받아보실 수 있어요.</p>
            </div>

            
            <div class="register-all-agree">
                <input class="register-checkbox" type="checkbox"/> 앱푸시      
                <input class="register-checkbox" type="checkbox"/> SMS
                <input class="register-checkbox" type="checkbox"/> 이메일
            </div>

            <div class="register-alarm">
                ※ 보유 및 이용기간 : 회원탈퇴 시 또는 마케팅 동의 철회 시까지
            </div>
            
  
        </div>
            <hr>
              <div class="register-info">개인정보 수집 및 이용 안내</div>
            <hr>
       
        <button class="register-button">
          다음
        </button>
        </div>
    </article>
    </main>
</body>
</html>
