<!DOCTYPE html>
<html lang="ko-KR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"/>
</head>
<body class="bg-body mx-5 mt-5 mb-2">
  <header>
    <!-- <p class="text-secondary">개인 실습</p>
    <h1 class="fw-bold ">완성 화면</h1> -->
  </header>  
  <main class="container py-5  ">
    <section class="bg-body border rounded-4 p-4 p-md-5">
      <div class="row align-items-center g-5">
        <div class="col-12 col-lg-8">
          <span class="badge text-bg-success mb-3">신청 가능</span>
          <small>Frontend Study #03</small>
          <h1 class="fw-bold mb-1">Bootstrap 실전 스터디</h1>
          <p class="text-secondary mb-4">Bootstrap의 Grid, Utility, Component를 활용해 반응형 웹 UI를 함께 제작하는 오프라인 스터디입니다.</p>
          
          <div class="list-group list-group-flush border-top border-bottom mb-4">
            
            <div class="list-group-item px-0 py-3 d-flex justify-content-between">
              <span>일정</span>
              <strong>9월 12일 토요일 · 14:00</strong>
            </div>
            
            <div class="list-group-item px-0 py-3 d-flex justify-content-between">
              <span>장소</span>
              <strong>강남 스터디룸 A</strong>
            </div>

            <div class="list-group-item px-0 py-3 d-flex justify-content-between">
              <span>진행 시간</span>
              <strong>약 2시간</strong>
            </div>
          </div>
            <div class="d-flex">
              <span class="badge rounded-pill text-bg-light border px-3 py-2">Grid</span>
              <span class="badge rounded-pill text-bg-light border px-3 py-2">Utility</span>
              <span class="badge rounded-pill text-bg-light border px-3 py-2">Responsive</span>
            </div>
        </div>

        <div class="col-12 col-lg-4">
          <div class="bg-light rounded-4 p-4">
            <p>현재 신청 인원</p>
            <div class="d-flex justify-content-between align-items-end">
              <strong class="fs-2">18명</strong>
              <span>/ 24명</span>
            </div>
            <div
              class="progress-stacked mb-3"
              role="progressbar"
              aria-label="스터디 신청 현황"
              aria-valuenow="75"
              aria-valuemin="0"
              aria-valuemax="100"
            >

              <div class="progress-bar" style="width: 75%;">75%</div>  
            </div>
            <div class="alert alert-warning mb-4" role="alert">
            남은 자리가 많지 않습니다.
            </div>
            <a href="#" class=" mt-3 btn btn-dark btn-lg w-100" role="button">스터디 참가 신청</a>        
        </div>
      </div>
    </div>
    </section>


  </main>
</body>
</html>
