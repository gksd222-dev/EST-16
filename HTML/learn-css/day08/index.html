      <hr/>
      <div>
        <label class="form-label" for="email" >이메일</label>
        <input class="form-control" id="email"/>
      </div>

    
    <div class="mb-4">

        <input class="form-control" id="password" type="password" />

    </div>
    <button type="button" class="btn btn-primary w-100">login</button>
    </div>
  </div>

  <div class="container p-5">
    <button
      type="button"
      class="btn btn-primary"
      data-bs-toggle="collapse"
      data-bs-target=".info,.info2"
    >
      강의 정보 보기
    </button>
  </div>

  <div class="collapse mt-3 info" id="info">
    <div class="card card-body">
      HTML, CSS, Bootstrap을 활용하여 반응형 웹 페이지를 제작합니다.
    </div>

  <button
    type="button"

    data-bs-toggle="modal"

  </button>

  <div class="modal fade" id="courseModal">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">

          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="닫기"
          >

          </button>
        </div>
        <div class="modal-body">HTML, CSS, Bootstrap을 배울 수 있는 강의입니다.</div>
        <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary">Save changes</button>
      </div>
      </div>
    </div>
