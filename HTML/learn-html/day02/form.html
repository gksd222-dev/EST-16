<!DOCTYPE html>
<html lang="ko-KR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form 태그를 배워보자!</title>
</head>
<body>
    <!-- input + tab -->
    <div>
        아이디 : <input type="text">
    </div>
    <div>
      비밀번호 : <input type="password">   
    </div>
    <div>
      이메일 : <input type="email">
    </div>
    <div>
      위 내용을 확인했습니다. <input type="checkbox"/>
    </div>
    <div>
      남자 <input type="radio" name="r"/>
      여자 <input type="radio" name="r"/>
    </div>
    <div>
      파일 첨부 <input type="file"/>
    </div>
    <div>
      음향조절 <input type="range"/>
    </div>
    <div>
      날짜 <input type="date"/>
    </div>
    <div>
      색상 선택 <input type="color">
    </div>
</body>
</html>
